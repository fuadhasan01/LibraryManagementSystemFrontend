<div class="spinner-container">
  <div class="spinner-border text-primary" 
       [class.spinner-border-sm]="size === 'small'"
       [style.width]="size === 'large' ? '4rem' : size === 'medium' ? '3rem' : '2rem'"
       [style.height]="size === 'large' ? '4rem' : size === 'medium' ? '3rem' : '2rem'"
       role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p class="mt-2 text-muted" *ngIf="message">{{ message }}</p>
</div>
